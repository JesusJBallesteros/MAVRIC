<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" width="1160" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>MAVRIC workflow: hardware, acquire, session folder, review, analyze, compress</title>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #52514e; stroke-width: 1.5; }
      .cmd { fill: #ffffff; stroke: #2a78d6; stroke-width: 2.5; }
      .h { fill: #0b0b0b; font-weight: 600; font-size: 15px; }
      .c { fill: #2a78d6; font-family: Consolas, Menlo, monospace; font-size: 13px; font-weight: 600; }
      .t { fill: #0b0b0b; }
      .s { fill: #52514e; font-size: 12px; }
      .a { stroke: #52514e; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .o { stroke: #eb6834; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arro); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/>
    </marker>
  </defs>
  <rect width="1160" height="430" fill="#fcfcfb"/>

  <!-- hardware -->
  <rect x="20" y="40" width="210" height="300" rx="8" class="box"/>
  <text x="35" y="66" class="h">Hardware</text>
  <text x="35" y="96" class="t">RFID places</text>
  <text x="35" y="113" class="s">4× ID-20LA → Arduino MEGA</text>
  <text x="35" y="143" class="t">Cameras</text>
  <text x="35" y="160" class="s">FLIR / Basler / webcam</text>
  <text x="35" y="190" class="t">Microphones, speakers</text>
  <text x="35" y="207" class="s">MOTU M4 (optional)</text>
  <text x="35" y="237" class="t">Sync pulse (D22)</text>
  <text x="35" y="254" class="s">LED in view of the cameras,</text>
  <text x="35" y="270" class="s">audio input, Intan</text>
  <text x="35" y="300" class="s">one random pulse train ties</text>
  <text x="35" y="316" class="s">every stream to one clock</text>
  <path d="M230 190 H268" class="a"/>

  <!-- acquire -->
  <rect x="270" y="40" width="230" height="300" rx="8" class="cmd"/>
  <text x="285" y="66" class="c">mavric acquire</text>
  <text x="285" y="96" class="t">live view, perch ROIs</text>
  <text x="285" y="116" class="t">live RFID and audio</text>
  <text x="285" y="136" class="t">video settings</text>
  <text x="285" y="156" class="t">record a session</text>
  <text x="285" y="186" class="s">RFID-triggered</text>
  <text x="285" y="202" class="s">camera clips</text>
  <text x="285" y="232" class="s">outputs while armed:</text>
  <text x="285" y="248" class="s">TTL, Intan, MATLAB, …</text>
  <path d="M500 190 H538" class="a"/>
  <path d="M385 340 V390 H180" class="o"/>
  <text x="190" y="408" class="s" fill="#eb6834">event-driven outputs (I/O Arduino, Intan RHX, MATLAB, programs)</text>

  <!-- session folder -->
  <rect x="540" y="40" width="250" height="300" rx="8" class="box"/>
  <text x="555" y="66" class="h">Session folder</text>
  <text x="555" y="96" class="s">session.json (clock anchor, setup)</text>
  <text x="555" y="116" class="s">rfid_raw.csv</text>
  <text x="555" y="136" class="s">cam0_raw_000.mkv … (lossless)</text>
  <text x="555" y="156" class="s">frames_cam0.csv (true frame times)</text>
  <text x="555" y="176" class="s">audio_000.flac + sync edges</text>
  <text x="555" y="196" class="s">clips/ (triggered clips)</text>
  <text x="555" y="216" class="s">actions.csv (outputs)</text>
  <text x="555" y="246" class="s">labels, sound events,</text>
  <text x="555" y="262" class="s">analysis/ added later</text>

  <!-- branches -->
  <path d="M790 110 H858" class="a"/>
  <path d="M790 190 H858" class="a"/>
  <path d="M790 270 H858" class="a"/>
  <rect x="860" y="72" width="280" height="76" rx="8" class="cmd"/>
  <text x="875" y="96" class="c">mavric review</text>
  <text x="875" y="116" class="s">blind place labels, RFID curation,</text>
  <text x="875" y="132" class="s">sound events and emitters</text>
  <rect x="860" y="152" width="280" height="76" rx="8" class="cmd"/>
  <text x="875" y="176" class="c">mavric analyze</text>
  <text x="875" y="196" class="s">sync check (PASS/FAIL), RFID vs labels,</text>
  <text x="875" y="212" class="s">accuracy, time budgets, plots</text>
  <rect x="860" y="232" width="280" height="76" rx="8" class="cmd"/>
  <text x="875" y="256" class="c">mavric compress</text>
  <text x="875" y="276" class="s">→ cam0_compressed.mp4 (H.264):</text>
  <text x="875" y="292" class="s">sharing, BORIS, DeepLabCut</text>
  <text x="860" y="340" class="s">review feeds labels into analyze;</text>
  <text x="860" y="356" class="s">all times are seconds on one session clock</text>
</svg>
