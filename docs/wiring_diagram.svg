<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" width="1500" height="1100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <title>MAVRIC wiring: PC, Arduino MEGA, four ID-20LA readers, IR sync LED, two Chameleon3 cameras, MOTU M4 audio, optional I/O Arduino and Intan</title>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #52514e; stroke-width: 1.5; }
      .obox { fill: #ffffff; stroke: #52514e; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .t { fill: #0b0b0b; }
      .s { fill: #52514e; }
      .h { fill: #0b0b0b; font-weight: 600; font-size: 13px; }
      .usb { stroke: #898781; stroke-width: 5; fill: none; stroke-linecap: round; }
      .pwr { stroke: #e34948; stroke-width: 2; fill: none; }
      .gnd { stroke: #0b0b0b; stroke-width: 2; fill: none; }
      .dat { stroke: #2a78d6; stroke-width: 2; fill: none; }
      .tir { stroke: #1baf7a; stroke-width: 2; fill: none; }
      .syn { stroke: #eb6834; stroke-width: 2.5; fill: none; }
      .aud { stroke: #6250d6; stroke-width: 2.5; fill: none; }
      .spk { stroke: #e87ba4; stroke-width: 2.5; fill: none; }
      .ttl { stroke: #eda100; stroke-width: 2.5; fill: none; }
      .opt { stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1500" height="1100" fill="#fcfcfb"/>
  <text x="20" y="22" class="h" font-size="15">MAVRIC wiring overview (solid = required, dashed = optional)</text>

  <!-- PC -->
  <rect x="430" y="40" width="580" height="80" rx="6" class="box"/>
  <text x="445" y="62" class="h">Cage PC</text>
  <text x="445" y="80" class="s">conda env mavric · Spinnaker SDK · MOTU M-Series driver (ASIO)</text>
  <text x="445" y="98" class="s">USB: MEGA · cam0 · cam1 · MOTU M4 · I/O Arduino (optional)</text>
  <text x="445" y="114" class="s">cameras on separate USB 3.0 controllers if possible</text>
  <path d="M560 120 V200" class="usb"/>
  <text x="570" y="164" class="s">USB A–B: power + serial 500000 baud</text>
  <path d="M1010 90 H1160 V200" class="usb"/>
  <text x="1018" y="110" class="s">cam0 · USB 3.0 ≤ 5 m</text>
  <path d="M1010 60 H1480 V420 H1460" class="usb"/>
  <text x="1190" y="52" class="s">cam1 · USB 3.0 (power + video)</text>

  <!-- 5 V supply and buses -->
  <rect x="20" y="660" width="250" height="70" rx="6" class="box"/>
  <text x="32" y="682" class="h">5 V regulated supply</text>
  <text x="32" y="700" class="s">linear (7805-class), &lt; 3 mV ripple</text>
  <text x="32" y="716" class="s">≥ 300 mA (4 × 45 mA readers)</text>
  <path d="M40 660 V260" class="pwr"/>
  <path d="M60 660 V280" class="gnd"/>
  <text x="36" y="652" class="s" fill="#e34948" text-anchor="end">+5V</text>
  <text x="64" y="652" class="s">GND</text>

  <!-- readers -->
  <g id="readers">
    <rect x="90" y="235" width="220" height="62" rx="5" class="box"/>
    <text x="100" y="251" class="h">ID-20LA · reader 1</text>
    <text x="100" y="267" class="s">11 +5V · 2 RES</text>
    <text x="100" y="287" class="s">1 GND · 7 FORM</text>
    <text x="302" y="267" class="t" text-anchor="end">9 D0</text>
    <text x="302" y="287" class="t" text-anchor="end">6 TIR</text>
    <path d="M40 260 H90" class="pwr"/><path d="M60 280 H90" class="gnd"/>
    <path d="M310 260 H430" class="dat"/><path d="M310 280 H430" class="tir"/>

    <rect x="90" y="315" width="220" height="62" rx="5" class="box"/>
    <text x="100" y="331" class="h">ID-20LA · reader 2</text>
    <text x="100" y="347" class="s">11 +5V · 2 RES</text>
    <text x="100" y="367" class="s">1 GND · 7 FORM</text>
    <text x="302" y="347" class="t" text-anchor="end">9 D0</text>
    <text x="302" y="367" class="t" text-anchor="end">6 TIR</text>
    <path d="M40 340 H90" class="pwr"/><path d="M60 360 H90" class="gnd"/>
    <path d="M310 340 H430" class="dat"/><path d="M310 360 H430" class="tir"/>

    <rect x="90" y="395" width="220" height="62" rx="5" class="box"/>
    <text x="100" y="411" class="h">ID-20LA · reader 3</text>
    <text x="100" y="427" class="s">11 +5V · 2 RES</text>
    <text x="100" y="447" class="s">1 GND · 7 FORM</text>
    <text x="302" y="427" class="t" text-anchor="end">9 D0</text>
    <text x="302" y="447" class="t" text-anchor="end">6 TIR</text>
    <path d="M40 420 H90" class="pwr"/><path d="M60 440 H90" class="gnd"/>
    <path d="M310 420 H430" class="dat"/><path d="M310 440 H430" class="tir"/>

    <rect x="90" y="475" width="220" height="62" rx="5" class="box"/>
    <text x="100" y="491" class="h">ID-20LA · reader 4</text>
    <text x="100" y="507" class="s">11 +5V · 2 RES</text>
    <text x="100" y="527" class="s">1 GND · 7 FORM</text>
    <text x="302" y="507" class="t" text-anchor="end">9 D0</text>
    <text x="302" y="527" class="t" text-anchor="end">6 TIR</text>
    <path d="M40 500 H90" class="pwr"/><path d="M60 520 H90" class="gnd"/>
    <path d="M310 500 H430" class="dat"/><path d="M310 520 H430" class="tir"/>
  </g>
  <text x="90" y="560" class="s">Each reader: 1000 µF + 100 nF between pins 11 and 1,</text>
  <text x="90" y="576" class="s">close to the module. Pins 3, 4, 5, 8, 10 unconnected.</text>
  <text x="90" y="592" class="s">Reader n = antenna n in rig.yaml (1 PerchA … 4 PerchD).</text>
  <text x="90" y="612" class="s">Optional: 47 kΩ from each TIR input (D2–D5) to GND,</text>
  <text x="90" y="628" class="s">so a broken TIR wire reads "no tag".</text>

  <!-- MEGA -->
  <rect x="430" y="200" width="260" height="420" rx="6" class="box"/>
  <text x="560" y="222" class="h" text-anchor="middle">Arduino MEGA 2560</text>
  <text x="560" y="238" class="s" text-anchor="middle">MultiRFID_Reader_ID20LA_sync</text>
  <text x="440" y="264" class="t">D19 RX1</text>
  <text x="440" y="284" class="t">D2</text>
  <text x="440" y="344" class="t">D17 RX2</text>
  <text x="440" y="364" class="t">D3</text>
  <text x="440" y="424" class="t">D15 RX3</text>
  <text x="440" y="444" class="t">D4</text>
  <text x="440" y="504" class="t">D10 (SoftSerial)</text>
  <text x="440" y="524" class="t">D5</text>
  <text x="440" y="599" class="t">GND</text>
  <text x="682" y="474" class="t" text-anchor="end">D52 SYNC</text>
  <text x="682" y="599" class="t" text-anchor="end">GND</text>
  <text x="610" y="290" class="s" text-anchor="middle">leave unconnected:</text>
  <text x="610" y="306" class="s" text-anchor="middle">D18 · D16 · D14 (TX)</text>
  <text x="610" y="322" class="s" text-anchor="middle">D11 · A0 (seed)</text>
  <text x="610" y="380" class="s" text-anchor="middle">D13 on-board LED</text>
  <text x="610" y="396" class="s" text-anchor="middle">= a tag is present</text>
  <text x="610" y="540" class="s" text-anchor="middle">D52: 80 ms pulse at random</text>
  <text x="610" y="556" class="s" text-anchor="middle">2–6 s, logged as SYNC</text>
  <path d="M270 700 H400 V595 H430" class="gnd"/>
  <text x="285" y="692" class="s">common GND</text>

  <!-- IR sync LED on D52 -->
  <path d="M690 470 H760" class="syn"/>
  <circle cx="720" cy="470" r="4" fill="#eb6834"/>
  <rect x="760" y="462" width="44" height="16" rx="2" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="782" y="495" class="s" text-anchor="middle">220 Ω</text>
  <path d="M804 470 H820" class="syn"/>
  <path d="M820 458 L820 482 L842 470 Z" fill="#eb6834"/>
  <path d="M842 458 V482" class="syn"/>
  <path d="M830 452 l10 -12 M840 455 l10 -12" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="3 2"/>
  <path d="M842 470 H858 V500" class="gnd"/>
  <path d="M848 500 H868 M852 506 H864 M856 512 H860" class="gnd"/>
  <text x="878" y="510" class="s">MEGA GND</text>
  <text x="740" y="420" class="t">IR sync LED · OIS-330 740 (740 nm)</text>
  <text x="740" y="436" class="s">anode = marked end · ≈ 15 mA</text>
  <text x="740" y="540" class="s">Aim it at both cameras; draw the SYNC</text>
  <text x="740" y="556" class="s">box over it on cam0 (wiring.md §4.4).</text>
  <text x="740" y="572" class="s">Two LEDs: in series with one 100 Ω.</text>

  <!-- D52 sync bus down to Intan and the audio interface -->
  <path d="M720 470 V990" class="syn"/>
  <text x="728" y="640" class="s">same D52 pulse to</text>
  <text x="728" y="656" class="s">audio (and Intan)</text>

  <!-- cameras -->
  <rect x="1060" y="200" width="400" height="130" rx="6" class="box"/>
  <text x="1075" y="222" class="h">Chameleon3 cam0 (CM3-U3-13Y3M)</text>
  <text x="1075" y="242" class="t">serial 12345678 · ROI camera</text>
  <text x="1075" y="260" class="s">perch ROIs and the SYNC box are drawn on its image</text>
  <text x="1075" y="278" class="s">record: continuous video, 30 fps</text>
  <text x="1075" y="302" class="s">GPIO not needed. Optional: D52 → pin 9 OPTO_IN,</text>
  <text x="1075" y="318" class="s">MEGA GND → pin 7 OPTO_GND (wiring.md §5.3)</text>

  <rect x="1060" y="350" width="400" height="130" rx="6" class="box"/>
  <text x="1075" y="372" class="h">Chameleon3 cam1 (CM3-U3-13Y3M)</text>
  <text x="1075" y="392" class="t">serial 12345679 · record: triggered</text>
  <text x="1075" y="410" class="s">clips only, while RFID rules match:</text>
  <text x="1075" y="428" class="s">acquire → Outputs… → Camera clips</text>
  <text x="1075" y="452" class="s">keep the IR sync LED in view too</text>
  <text x="1075" y="468" class="s">(clips are timed with the same pulses)</text>

  <!-- optional I/O Arduino and Intan -->
  <rect x="40" y="850" width="240" height="100" rx="6" class="obox"/>
  <text x="55" y="872" class="h">I/O Arduino (optional)</text>
  <text x="55" y="890" class="s">firmware MAVRIC_IO · USB ▸ PC</text>
  <text x="55" y="908" class="s">D30 → Intan DIGITAL IN 1</text>
  <text x="55" y="926" class="s">GND → Intan I/O GND</text>
  <text x="55" y="942" class="s">(Outputs… rules: TTL, LEDs)</text>
  <path d="M280 904 H330" class="ttl opt"/>

  <rect x="330" y="850" width="270" height="160" rx="6" class="obox"/>
  <text x="345" y="872" class="h">Intan RHD controller (optional)</text>
  <text x="345" y="908" class="t">DIGITAL IN 1 ◂ I/O Arduino D30</text>
  <text x="345" y="924" class="s">event TTL / triggered recording</text>
  <text x="345" y="964" class="t">DIGITAL IN 2 ◂ MEGA D52</text>
  <text x="345" y="980" class="s">sync pulses into the ephys data</text>
  <text x="345" y="1000" class="s">I/O GND ◂ both Arduino GNDs</text>
  <path d="M720 960 H600" class="syn opt"/>
  <circle cx="720" cy="960" r="4" fill="#eb6834"/>

  <!-- audio: microphones, sync divider, MOTU M4, speakers -->
  <rect x="760" y="860" width="140" height="36" rx="5" class="box"/>
  <text x="772" y="883" class="t">Rode NT5 · micA</text>
  <rect x="760" y="910" width="140" height="36" rx="5" class="box"/>
  <text x="772" y="933" class="t">Rode NT5 · micB</text>
  <path d="M900 878 H960" class="aud"/>
  <path d="M900 928 H960" class="aud"/>
  <text x="904" y="870" class="s" font-size="11">XLR</text>

  <path d="M720 990 H760" class="syn"/>
  <rect x="760" y="982" width="44" height="16" rx="2" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="782" y="1016" class="s" text-anchor="middle">10 kΩ</text>
  <path d="M804 990 H960" class="syn"/>
  <circle cx="840" cy="990" r="3.5" fill="#eb6834"/>
  <path d="M840 990 V998" class="syn"/>
  <rect x="832" y="998" width="16" height="30" rx="2" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="854" y="1018" class="s">1 kΩ</text>
  <path d="M840 1028 V1040" class="gnd"/>
  <path d="M830 1040 H850 M834 1046 H846 M838 1052 H842" class="gnd"/>
  <text x="860" y="1046" class="s">MEGA GND</text>
  <text x="866" y="980" class="s" font-size="11">≈ 0.45 V, TS</text>
  <text x="760" y="972" class="s" font-size="11">divider at the plug</text>

  <text x="960" y="822" class="h">MOTU M4 · USB-C ▸ PC · ASIO · 48 kHz</text>
  <rect x="960" y="830" width="240" height="210" rx="6" class="box"/>
  <text x="970" y="882" class="t">In 1 · 48V on</text>
  <text x="970" y="932" class="t">In 2 · 48V on</text>
  <text x="970" y="994" class="t">In 3 · sync</text>
  <text x="970" y="1012" class="s" font-size="11">(rear line in)</text>
  <text x="1192" y="882" class="t" text-anchor="end">Out 1</text>
  <text x="1192" y="922" class="t" text-anchor="end">Out 2</text>
  <text x="1192" y="962" class="t" text-anchor="end">Out 3</text>
  <text x="1192" y="1002" class="t" text-anchor="end">Out 4</text>
  <text x="1080" y="1030" class="s" text-anchor="middle">MON buttons OFF</text>

  <path d="M1200 878 H1260" class="spk"/>
  <path d="M1200 918 H1260" class="spk"/>
  <path d="M1200 958 H1260" class="spk"/>
  <path d="M1200 998 H1260" class="spk"/>
  <text x="1206" y="870" class="s" font-size="11">TRS</text>
  <rect x="1260" y="862" width="200" height="32" rx="5" class="box"/>
  <text x="1272" y="883" class="t">powered speaker · spk1</text>
  <rect x="1260" y="902" width="200" height="32" rx="5" class="box"/>
  <text x="1272" y="923" class="t">powered speaker · spk2</text>
  <rect x="1260" y="942" width="200" height="32" rx="5" class="box"/>
  <text x="1272" y="963" class="t">powered speaker · spk3</text>
  <rect x="1260" y="982" width="200" height="32" rx="5" class="box"/>
  <text x="1272" y="1003" class="t">powered speaker · spk4</text>
  <text x="1260" y="1034" class="s">names in rig.yaml audio.speakers</text>

  <!-- legend -->
  <g transform="translate(20 1080)">
    <path d="M0 0 H30" class="usb"/><text x="38" y="4" class="s">USB</text>
    <path d="M85 0 H115" class="pwr"/><text x="123" y="4" class="s">+5 V</text>
    <path d="M170 0 H200" class="gnd"/><text x="208" y="4" class="s">GND</text>
    <path d="M255 0 H285" class="dat"/><text x="293" y="4" class="s">reader data D0</text>
    <path d="M395 0 H425" class="tir"/><text x="433" y="4" class="s">Tag-in-Range</text>
    <path d="M530 0 H560" class="syn"/><text x="568" y="4" class="s">sync pulse (D52)</text>
    <path d="M680 0 H710" class="aud"/><text x="718" y="4" class="s">microphone (XLR)</text>
    <path d="M840 0 H870" class="spk"/><text x="878" y="4" class="s">speaker line (TRS)</text>
    <path d="M1000 0 H1030" class="ttl opt"/><text x="1038" y="4" class="s">event TTL</text>
    <path d="M1120 0 H1150" class="syn opt"/><text x="1158" y="4" class="s">optional connection</text>
  </g>
</svg>
