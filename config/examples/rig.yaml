# MAVRIC rig configuration. Paths are relative to the project root.
# Example: the first run copies config/examples/* to config/; edit those copies (git ignores them).

rfid:
  port: auto          # Arduino MEGA serial port, or "auto" (first Arduino found by USB VID)
  baud: 500000        # must match Serial.begin() in the firmware
  reset_wait_s: 2.0   # opening the port resets the MEGA; wait before flushing
  round_period_s: 0.125  # firmware LOG_INTERVAL_US (8 Hz sampling rounds)

# Reader number (firmware 1..4) -> place / ROI name
antennas:
  1: PlaceA
  2: PlaceB
  3: PlaceC
  4: PlaceD

cameras:
  # One entry per camera, each with its own id. The first camera is the ROI camera:
  # place ROIs and the sync LED box are drawn on its image.
  - id: cam0
    backend: flir          # flir (Spinnaker/PySpin, e.g. a Chameleon3) | basler | opencv | file | synthetic
    device: ""             # flir/basler: serial number ("" = first found; `mavric ports` lists them); opencv: index; file: video path
    fps: 30                # CM3-U3-13Y3M: up to 91 fps Mono8 full frame; 13S2: 30; 28S4: 13 (see README)
    exposure_us: 8000      # must be shorter than 1/fps
    gain_db: 0.0
    pixel_format: Mono8    # Mono8 | BGR8 (colour models: on-board RGB, else raw Bayer demosaiced); opencv delivers BGR
    chunk_frame_counter: true  # flir: the camera's own frame counter -> true camera-side drop count
    # link_limit_mb_s: 150  # flir: cap this camera's USB share when several cameras get incomplete images together
    line_status: false     # Chameleon3 has no per-frame line status, so the sync LED in the image is used (Blackfly S: true works)
    record: continuous     # continuous | triggered (only clips from clip rules: Outputs... -> Camera clips)
    # frame_trigger: true  # expose on each pulse of sync: frame_trigger (below), for frame-locked 3D; fps comes from there
    # trigger_line: Line0  # the trigger input (flir default Line0, the opto input; basler default Line1)
  # A second camera: delete "# " (the hash and the space after it) from each line below,
  # so "- id:" lines up with the "- id:" above, and give it its own serial number.
  # - id: cam1             # e.g. a camera that only records RFID-triggered clips
  #   backend: flir
  #   device: "40000001"
  #   fps: 30
  #   exposure_us: 8000
  #   record: triggered

# Recording format, raw chunk size and compression defaults are also set in the acquire GUI
# (Video settings..., saved in config/video.yaml, which overrides this file).
video:
  record_format: raw  # raw: lossless chunks, compress afterwards (mavric compress) | h264: compressed while recording
  raw_codec: ffv1     # ffv1 (lossless, ~half size) | rawvideo (uncompressed)
  raw_chunk_mb: 2000  # start a new raw file every ~2 GB
  compress: {codec: libx264, crf: 18, preset: medium, gop: 30}   # mavric compress defaults (DeepLabCut-friendly)
  codec: libx264      # h264 recording: libx264 | mpeg4 (falls back to mpeg4 automatically)
  crf: 20
  gop_s: 1.0          # keyframe interval; short GOP keeps seeking in review fast
  preset: veryfast

# RFID-triggered clips (optional). A clip records on `camera` while a matching tag
# is present at one of `antennas`, plus pre_s before (ring buffer) and post_s after.
# Easier: acquire GUI -> Outputs... -> Camera clips (saved in config/outputs.yaml).
# Rules written here are used as well.
triggers: []
# triggers:
#   - name: placeB_clip
#     camera: cam1
#     antennas: [2]      # reader numbers, or "any"
#     match: any         # "any", or a list of subject names / tag IDs, e.g. [S01, S03]
#     pre_s: 3
#     post_s: 5
#     max_s: 300         # split clips longer than this

# Audio (optional): MOTU M4 with two NT5 microphones, the sync pulse and four speakers (docs/wiring.md §7).
# `mavric audio devices` lists what is connected; `mavric audio test --tones` checks it.
audio:
  enabled: false       # true: headless acquisition records audio (GUI: Connect audio)
  device: MOTU         # name substring of the device
  host_api: ASIO       # ASIO (MOTU driver) | WASAPI | MME
  sample_rate: 48000
  block: 1024          # samples per callback; raise if `audio test` reports overflows
  latency: high        # high | low | seconds
  inputs:              # M4 input -> name (list them all)
    1: micA            # NT5, 48 V on
    2: micB            # NT5, 48 V on
    3: sync            # RFID MEGA D50 through the 10k/1.8k divider (TRS: tip signal, ring GND)
  sync_channel: sync
  speakers:            # M4 output -> name
    1: spk1
    2: spk2
    3: spk3
    4: spk4
  format: FLAC         # FLAC | WAV
  split_s: 3600
  max_level_dbfs: -6   # playback limiter: the mix is clipped above this level
  sounds_dir: sounds   # stimulus library: WAV/FLAC files, ideally 48 kHz mono (`mavric audio sounds` lists them)
  mic_near: {}         # mic -> antennas beside it, e.g. {micA: [1, 3], micB: [2, 4]}; ranks emitter suggestions
  temperature_c: 20    # room temperature: the speed of sound when the speakers check the device positions

sync:
  led_roi_name: SYNC  # name of the rectangle ROI over the sync LED
  led_pulse_s: 0.080  # = firmware SYNC_PULSE_US; must cover >= 2 frame intervals (warned otherwise)
  frame_trigger:      # one pulse per frame into every camera with frame_trigger: true (3D: frames taken together)
    source: none      # none | rfid (the RFID MEGA sends it on D46 while connected) | external (your own generator)
    fps: 30           # the pulses per second: the frame rate of every frame-triggered camera

# Camera calibration board: a ChArUco board, i.e. a checkerboard with an ArUco marker in every white square.
# A plain checkerboard becomes one with stickers: `mavric calibrate sheet` prints them for the board below.
# Hold the board with a black square at the top left. Acquire: Calibrate cameras...
calibration:
  board:
    squares: [8, 10]      # squares across, down
    square_mm: 39.0       # measure it: 10 squares with calipers, divided by 10
    marker_mm: 29.0       # printed marker side (the stickers' black square)
    dictionary: DICT_4X4_50

paths:
  sessions_dir: sessions
  tags_file: config/tags.csv
  rois_file: config/rois.json
  outputs_file: config/outputs.yaml   # event-driven outputs (acquire GUI: Outputs...)
  sound_types_file: config/sound_types.yaml  # sound event types (review GUI: Sound events -> Types...)
  calibration_file: config/calibration.yaml  # camera calibration (acquire GUI: Calibrate cameras...)
